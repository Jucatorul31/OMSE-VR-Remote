name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dezarhivare proiect
        run: unzip -o OMSE-VR-Remote.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: OMSE-VR-Remote
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: OMSE-VR-Remote-apk
          path: OMSE-VR-Remote/app/build/outputs/apk/release/*.apk
