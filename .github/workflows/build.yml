name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dezarhivare proiect (orice .zip din repository)
        run: |
          ls -la *.zip
          f=$(ls *.zip | head -1)
          echo "Folosesc: $f"
          unzip -o "$f"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        working-directory: OMSE-VR-Remote
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk ../out/
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: APK-build-${{ github.run_number }}
          path: out/*.apk
